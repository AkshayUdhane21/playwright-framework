name: SonarQube Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        path: vcpkg

    - name: Cache vcpkg packages
      uses: actions/cache@v3
      with:
        path: |
          vcpkg/installed
          vcpkg/buildtrees
        key: linux-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          linux-vcpkg-

    - name: Install vcpkg dependencies
      run: |
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg install --triplet x64-linux

    - name: Download SonarQube Build Wrapper
      run: |
        wget -q https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
        unzip -q build-wrapper-linux-x86.zip
        mv build-wrapper-linux-x86 build-wrapper

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

    - name: Build with SonarQube Build Wrapper
      run: |
        ./build-wrapper/build-wrapper-linux-x86-64 --out-dir bw-output bash -c "cmake --build build --config Release -j$(nproc)"

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


