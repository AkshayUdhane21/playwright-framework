name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Setup vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure CMake (installs dependencies via manifest)
        shell: bash
        run: |
          VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

      - name: Download SonarCloud Build Wrapper
        run: |
          mkdir -p build-wrapper
          # Try GitHub releases first (more reliable)
          if ! curl -L -f -o build-wrapper/build-wrapper-linux-x86-64.zip \
            https://github.com/SonarSource/build-wrapper/releases/download/6.0.0.23903/build-wrapper-linux-x86-64.zip; then
            echo "GitHub download failed, trying SonarCloud..."
            curl -L -f -o build-wrapper/build-wrapper-linux-x86-64.zip \
              https://sonarcloud.io/static/cpp/build-wrapper-linux-x86-64.zip
          fi
          # Verify the file was downloaded correctly
          if [ ! -f build-wrapper/build-wrapper-linux-x86-64.zip ] || [ ! -s build-wrapper/build-wrapper-linux-x86-64.zip ]; then
            echo "Error: Build wrapper download failed"
            exit 1
          fi
          unzip -q build-wrapper/build-wrapper-linux-x86-64.zip -d build-wrapper
          chmod +x build-wrapper/build-wrapper-linux-x86-64/build-wrapper-linux-x86-64

      - name: Build with SonarCloud Build Wrapper
        run: |
          ./build-wrapper/build-wrapper-linux-x86-64/build-wrapper-linux-x86-64 \
            --out-dir bw-output \
            cmake --build build --parallel

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure || true

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
