name: CI Build, Test and SonarCloud Analysis

on:
  push:
    branches: [ main, master, develop, akshay ]
  pull_request:
    branches: [ main, master, develop, akshay ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build-type: [Release]
        include:
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            vcpkg-bootstrap: "./vcpkg/bootstrap-vcpkg.sh"
          - os: windows-latest
            generator: "Visual Studio 17 2022"
            vcpkg-bootstrap: "./vcpkg/bootstrap-vcpkg.bat"
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build-type }})
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better SonarQube analysis

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake -y

    - name: Set up vcpkg
      shell: bash
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ${{ matrix.vcpkg-bootstrap }}
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -G "${{ matrix.generator }}"

    - name: Build
      shell: bash
      run: cmake --build build --config ${{ matrix.build-type }}

    - name: Run tests
      shell: bash
      run: ctest --test-dir build --build-config ${{ matrix.build-type }} --output-on-failure
      continue-on-error: true  # Don't fail if tests fail

    - name: Upload compile_commands.json (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: compile-commands-linux
        path: build/compile_commands.json
        if-no-files-found: ignore

    - name: Upload compile_commands.json (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: compile-commands-windows
        path: build/compile_commands.json
        if-no-files-found: ignore

  sonarcloud-analysis:
    name: SonarCloud Analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better SonarQube analysis

    - name: Download compile_commands.json
      uses: actions/download-artifact@v4
      with:
        name: compile-commands-linux
        path: .
        if-no-files-found: ignore

    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      continue-on-error: true  # Don't fail the workflow if SonarQube fails or secrets are missing
