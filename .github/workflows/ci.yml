name: CI Build, Test and SonarCloud Analysis

on:
  push:
    branches: [ main, master, develop, akshay ]
  pull_request:
    branches: [ main, master, develop, akshay ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build-type: [Release]
        include:
          - os: ubuntu-latest
            generator: "Unix Makefiles"
            vcpkg-bootstrap: "./vcpkg/bootstrap-vcpkg.sh"
          - os: windows-latest
            generator: "Visual Studio 17 2022"
            vcpkg-bootstrap: "./vcpkg/bootstrap-vcpkg.bat"
    runs-on: ${{ matrix.os }}
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build-type }})
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better SonarQube analysis

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake -y

    - name: Set up vcpkg
      shell: bash
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ${{ matrix.vcpkg-bootstrap }}
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -G "${{ matrix.generator }}"

    - name: Build
      shell: bash
      run: cmake --build build --config ${{ matrix.build-type }}

    - name: Run tests
      shell: bash
      run: ctest --test-dir build --build-config ${{ matrix.build-type }} --output-on-failure
      continue-on-error: true  # Don't fail if tests fail

    - name: Copy compile_commands.json to root (Linux)
      if: runner.os == 'Linux'
      run: |
        if [ -f build/compile_commands.json ]; then
          cp build/compile_commands.json .
          echo "compile_commands.json copied to root"
          ls -la compile_commands.json
        else
          echo "Warning: compile_commands.json not found in build directory"
          ls -la build/ || echo "Build directory not found"
        fi

    - name: Upload compile_commands.json (Linux only)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: compile-commands-linux
        path: compile_commands.json
        retention-days: 1

  sonarcloud-analysis:
    name: SonarCloud Analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    if: always()  # Run even if build jobs fail
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better SonarQube analysis

    - name: Download compile_commands.json
      uses: actions/download-artifact@v4
      with:
        name: compile-commands-linux
        path: .

    - name: Verify and fix compile_commands.json paths
      run: |
        if [ -f compile-commands-linux/compile_commands.json ]; then
          cp compile-commands-linux/compile_commands.json .
          echo "compile_commands.json found and copied to root"
          # Fix absolute paths to match current workspace
          WORKSPACE=$(pwd)
          sed -i "s|/home/runner/work/playwright-framework/playwright-framework|$WORKSPACE|g" compile_commands.json || true
          echo "Paths updated in compile_commands.json"
          head -5 compile_commands.json || echo "File exists but empty"
        else
          echo "Warning: compile_commands.json not found in artifact"
          ls -la compile-commands-linux/ || echo "Artifact directory not found"
        fi

    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      continue-on-error: true  # Don't fail the workflow if SonarQube fails or secrets are missing
