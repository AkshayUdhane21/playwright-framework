name: CI Build, Test, and SonarCloud Analysis

on:
  push:
    branches: [ main, master, develop, akshay ]
  pull_request:
    branches: [ main, master, develop, akshay ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        path: vcpkg

    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      run: |
        ./vcpkg/bootstrap-vcpkg.sh

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: |
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Configure CMake (installs vcpkg dependencies automatically via manifest)
      shell: bash
      run: |
        VCPKG_ROOT="${{ github.workspace }}/vcpkg"
        # Convert Windows path to Unix format if needed
        VCPKG_ROOT=$(echo "$VCPKG_ROOT" | sed 's|\\|/|g')
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      shell: bash
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Run Tests
      working-directory: build
      run: |
        ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        path: vcpkg

    - name: Bootstrap vcpkg
      run: |
        ./vcpkg/bootstrap-vcpkg.sh

    - name: Configure CMake (installs dependencies via manifest)
      shell: bash
      run: |
        VCPKG_ROOT="${{ github.workspace }}/vcpkg"
        # Convert Windows path to Unix format if needed
        VCPKG_ROOT=$(echo "$VCPKG_ROOT" | sed 's|\\|/|g')
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
    # Note: CFamily build-wrapper is disabled (URLs return 404 / not available).
    # We just build normally and let SonarCloud run without C++ compilation data.
    - name: Build (Release)
      shell: bash
      run: |
        cmake --build build --config Release --parallel

    - name: Run Tests
      working-directory: build
      run: |
        ctest --output-on-failure -C Release || true

    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
