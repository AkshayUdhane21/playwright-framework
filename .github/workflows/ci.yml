name: CI Pipeline

on:
  push:
    branches: [ main, master, Akshay ]
  pull_request:
    branches: [ main, master, Akshay ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    env:
      VCPKG_ROOT: ${{ env.VCPKG_ROOT || 'C:\\vcpkg' }}
      BUILD_TYPE: Debug
      BUILD_DIR: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup vcpkg
      run: |
        if (-not (Test-Path $env:VCPKG_ROOT)) {
          Write-Host "vcpkg not found at $env:VCPKG_ROOT"
          Write-Host "Installing vcpkg..."
          git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        }
        & "$env:VCPKG_ROOT\vcpkg.exe" version
        
    - name: Install dependencies
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows `
          nlohmann-json `
          curl `
          spdlog `
          openssl `
          open62541pp `
          gtest
        
    - name: Verify vcpkg toolchain
      run: |
        $vcpkgToolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
        if (-not (Test-Path $vcpkgToolchain)) {
          Write-Error "vcpkg toolchain file not found at: $vcpkgToolchain"
          exit 1
        }
        Write-Host "vcpkg toolchain found: $vcpkgToolchain"
        
    - name: Configure CMake
      run: |
        $vcpkgToolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
        cmake -B $env:BUILD_DIR `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
          -S .
          
    - name: Build project
      run: |
        cmake --build $env:BUILD_DIR `
          --config $env:BUILD_TYPE `
          --target config_test security_test `
          --parallel
          
    - name: Run tests
      run: |
        cd $env:BUILD_DIR
        $testNames = @('ConfigTest', 'SecurityTest')
        $testFailures = @()
        
        foreach ($testName in $testNames) {
          Write-Host "Running test: $testName"
          $result = ctest -C $env:BUILD_TYPE -R "^$testName$" --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            Write-Host "✗ $testName FAILED"
            $testFailures += $testName
          } else {
            Write-Host "✓ $testName PASSED"
          }
        }
        
        Write-Host "=========================================="
        Write-Host "Test Summary:"
        Write-Host "=========================================="
        foreach ($testName in $testNames) {
          if ($testFailures -contains $testName) {
            Write-Host "$testName : FAILED"
          } else {
            Write-Host "$testName : PASSED"
          }
        }
        Write-Host "=========================================="
        
        if ($testFailures.Count -gt 0) {
          Write-Error "Tests failed: $($testFailures -join ', ')"
          exit 1
        }
        
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-executables
        path: |
          ${{ env.BUILD_DIR }}/${{ env.BUILD_TYPE }}/bin/*test*.exe
        retention-days: 7


