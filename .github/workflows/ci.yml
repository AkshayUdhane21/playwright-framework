name: CI Pipeline

on:
  push:
    branches: [ main, master, Akshay ]
  pull_request:
    branches: [ main, master, Akshay ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    env:
      VCPKG_ROOT: C:\vcpkg
      BUILD_TYPE: Debug
      BUILD_DIR: build
      VCPKG_ARCHIVES: ${{ github.workspace }}\vcpkg_archives
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Ensure vcpkg and binary cache directory
      shell: pwsh
      run: |
        if (-not (Test-Path $env:VCPKG_ROOT)) {
          Write-Host "vcpkg not found at $env:VCPKG_ROOT"
          git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        }
        if (-not (Test-Path $env:VCPKG_ARCHIVES)) {
          New-Item -ItemType Directory -Path $env:VCPKG_ARCHIVES | Out-Null
        }
        $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_ARCHIVES,readwrite"
        Write-Host "VCPKG_BINARY_SOURCES: $env:VCPKG_BINARY_SOURCES"
        & "$env:VCPKG_ROOT\vcpkg.exe" version
        
    - name: Verify vcpkg toolchain
      shell: pwsh
      run: |
        $vcpkgToolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
        if (-not (Test-Path $vcpkgToolchain)) {
          Write-Error "vcpkg toolchain file not found at: $vcpkgToolchain"
          exit 1
        }
        Write-Host "vcpkg toolchain found: $vcpkgToolchain"
        
    - name: Configure CMake
      shell: pwsh
      run: |
        $vcpkgToolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
        $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_ARCHIVES,readwrite"
        cmake -B $env:BUILD_DIR `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DBUILD_TESTING=ON `
          -DVCPKG_BINARY_SOURCES="$env:VCPKG_BINARY_SOURCES" `
          -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
          -S .
          
    - name: Build project
      shell: pwsh
      run: |
        cmake --build $env:BUILD_DIR `
          --config $env:BUILD_TYPE `
          --target config_test security_test `
          --parallel
          
    - name: Run tests
      shell: pwsh
      run: |
        Push-Location $env:BUILD_DIR
        ctest -C $env:BUILD_TYPE -V --output-on-failure --progress --test-output-size-passed 10000000
        Pop-Location
        
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-executables
        path: |
          ${{ env.BUILD_DIR }}/${{ env.BUILD_TYPE }}/bin/*test*.exe
        retention-days: 7








