sonar.projectKey=AkshayUdhane21_playwright-framework
sonar.organization=akshayudhane21

sonar.projectName=ATS Yokogawa Connection Service
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Source and header files
sonar.sources=src,include

# Test files
sonar.tests=test

# Exclusions
sonar.exclusions=**/build/**,**/cmake-build-*/**,**/vcpkg/**,**/Testing/**,**/*.vcxproj,**/*.sln

# C/C++ specific: compilation database
# Required for accurate C++ analysis in SonarQube/SonarCloud
sonar.cfamily.compile-commands=compile_commands.json

# Coverage exclusions (if using coverage)
sonar.coverage.exclusions=**/test/**,**/main.cpp,**/main_service.cpp

